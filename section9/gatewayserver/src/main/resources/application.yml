
spring:
  application:
    name: gatewayserver
  config:
    import: "optional:configserver:http://localhost:8071/"

  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: false
              lowerCaseServiceId: true

          routes:
            - id: accounts
              uri: lb://accounts
              predicates:
                - Path=/accounts/**
              filters:
                - StripPrefix=1

            - id: loans
              uri: lb://loans
              predicates:
                - Path=/loans/**
              filters:
                - StripPrefix=1

            - id: cards
              uri: lb://cards
              predicates:
                - Path=/cards/**
              filters:
                - StripPrefix=1

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    gateway:
      access: unrestricted
  info:
    env:
      enabled: true

info:
  app:
    name: "gatewayserver"
    description: "Eazy Bank Gateway Server Application"
    version: "1.0.0"

logging:
  pattern:
    console: ${CONSOLE_LOG_PATTERN:%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %cyan(%msg%n)}
  level:
    com:
      eazybytes:
            gatewayserver: DEBUG
