spring:
  application:
    name: configserver

  profiles:
    active: git

  cloud:
    config:
      server:
        git:
          uri: "https://github.com/DurgeshRatnaparkhi/Microservices_docker.git"
          default-label: main
          search-paths: configserver/src/main/resources/config
          clone-on-start: true
          force-pull: true
      monitor:
        # Keep this only if your Spring Cloud Config version supports it
        validation-filter-enabled: false

  rabbitmq:
    host: rabbit
    port: 5672
    username: guest
    password: guest

server:
  port: 8071

management:
  endpoints:
    web:
      exposure:
        include: "*"
  health:
    readiness-state:
      enabled: true
    liveness-state:
      enabled: true
  endpoint:
    health:
      probes:
        enabled: true

encrypt:
  key: "${ENCRYPT_KEY}"

logging:
  pattern:
    console: "${CONSOLE_LOG_PATTERN:%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %cyan(%msg%n)}"
